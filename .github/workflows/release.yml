name: Build, Release, and Publish

on:
  push:
    # Trigger this workflow ONLY when a tag matching the pattern (e.g., v1.2.3) is pushed
    tags:
      - 'v*' 
  workflow_dispatch:
permissions:
  contents: write # Required to create the GitHub Release and upload files
  id-token: write # Required for secure OIDC publishing to PyPI

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Because this is triggered by a tag push, it automatically checks out that exact tag.

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Build package (sdist and wheel)
        run: uv build

      # --- PUBLISH TO PYPI ---
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        # Remember to configure PyPI "Trusted Publishers" for this GitHub repo!

      # --- CREATE GITHUB RELEASE ---
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # This tells GitHub to auto-generate a summary of commits for the release notes 
          # on the GitHub UI, which is handy since Semantic Release is running over on GitLab.
          generate_release_notes: true