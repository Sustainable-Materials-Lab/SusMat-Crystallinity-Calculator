# included templates
include:
  # Python template
  - component: "$CI_SERVER_FQDN/to-be-continuous/python/gitlab-ci-python@9.6.2"
    inputs:
      image: docker.io/library/python:3.15
      package-enabled: true
      publish-enabled: true
      trivy-disabled: false
      sbom-disabled: true
      build-system: "uv"
  # semantic-release template
  - component: "$CI_SERVER_FQDN/to-be-continuous/semantic-release/gitlab-ci-semrel@4.3.0"
    inputs:
      changelog-enabled: true
      auto-release-enabled: true
      commit-spec: conventionalcommits

semantic-release:
  variables:
    GITLAB_TOKEN: "$SUSMAT_RELEASE_TOKEN"

py-release:
  variables:
    GIT_PASSWORD: "$SUSMAT_RELEASE_TOKEN"
    GITLAB_USER_NAME: "$SUSMAT_RELEASE_USER"

