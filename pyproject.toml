[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "SusMat-Crystallinity-Calculator"
version = "2.0.8"
authors = [
  { name="Samuel Eyley", email="susmat-crystallinity.cyc4x@simplelogin.com" },
]
description = "A collection of python scripts for determining the crystallinity of cellulosic samples"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "python-irodsclient>=2.0.0",
    "numpy",
    "matplotlib",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/Sustainable-Materials-Lab/SusMat-Crystallinity-Calculator"
Issues = "https://github.com/Sustainable-Materials-Lab/SusMat-Crystallinity-Calculator/issues"

[project.scripts]
sm-cryst = "smcryst.cell_cryst:cli"
irods-cryst = "smcryst.cell_cryst_remote:cli"

[tool.uv.build-backend]
module-name = "smcryst"
